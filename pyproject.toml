[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "imgui_ophys"
version = "0.1.0"
description = "Standalone imgui-bundle apps that explain optical physiology concepts, one interactive lesson per idea."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Flynn OConnell", email = "flynnoconnell@gmail.com" }]
keywords = ["imgui", "imgui-bundle", "implot", "calcium-imaging", "ophys", "nmf", "teaching"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "imgui-bundle>=1.92,<2",
    "numpy>=1.23",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
debug = ["imgui_debugger @ git+https://github.com/FlynnOConnell/imgui_debugger@ad9986a59b19428c4fa42f0b64891f8e03bac592"]

[project.scripts]
imgui-ophys = "imgui_ophys.app:run"

[project.urls]
Homepage = "https://github.com/FlynnOConnell/imgui_ophys"
Source = "https://github.com/FlynnOConnell/imgui_ophys"
Issues = "https://github.com/FlynnOConnell/imgui_ophys/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
